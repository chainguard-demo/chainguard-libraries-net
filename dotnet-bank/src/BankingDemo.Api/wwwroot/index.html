<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Bank</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🏦 Demo Bank</h1>
    <nav><a href="/swagger" target="_blank">API docs</a> · <a href="/health" target="_blank">Health</a></nav>
  </header>

  <main>
    <section class="card">
      <h2>Accounts</h2>
      <table id="accounts">
        <thead><tr><th>Number</th><th>Owner</th><th class="num">Balance</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="grid">
      <form class="card" id="open-form">
        <h2>Open account</h2>
        <input name="ownerName" placeholder="Owner name" required maxlength="100" />
        <input name="initialDeposit" type="number" min="0" step="0.01" placeholder="Initial deposit" value="0" />
        <button>Open</button>
      </form>

      <form class="card" id="money-form">
        <h2>Deposit / withdraw</h2>
        <select name="accountId" class="account-select" required></select>
        <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required />
        <input name="description" placeholder="Description (optional)" maxlength="200" />
        <div class="row">
          <button name="action" value="deposit">Deposit</button>
          <button name="action" value="withdraw" class="secondary">Withdraw</button>
        </div>
      </form>

      <form class="card" id="transfer-form">
        <h2>Transfer</h2>
        <label>From <select name="fromAccountId" class="account-select" required></select></label>
        <label>To <select name="toAccountId" class="account-select" required></select></label>
        <input name="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required />
        <input name="description" placeholder="Description (optional)" maxlength="200" />
        <button>Transfer</button>
      </form>
    </section>

    <section class="card">
      <h2>Transactions <span id="tx-account" class="muted"></span></h2>
      <p class="muted" id="tx-hint">Select an account above to view its history.</p>
      <table id="transactions" hidden>
        <thead><tr><th>When</th><th>Type</th><th>Description</th><th class="num">Amount</th><th class="num">Balance</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
